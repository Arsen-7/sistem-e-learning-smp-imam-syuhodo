<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Logo SMP Muhammadiyah Imam Syuhodo</title>
  <desc id="desc">Logo sekolah berbentuk perisai biru bertuliskan SMP Muhammadiyah Imam Syuhodo.</desc>
  <defs>
    <path id="muhammadiyah-arc" d="M205 320 Q500 230 795 320"/>
    <path id="imam-arc" d="M275 760 Q500 835 725 760"/>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#05263d" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <polygon points="500 28 820 76 802 176 890 215 818 840 500 970 182 840 110 215 198 176 180 76" fill="#086da9"/>
    <polygon points="500 53 790 96 774 196 858 234 792 820 500 940 208 820 142 234 226 196 210 96" fill="none" stroke="#f5d21d" stroke-width="17" stroke-linejoin="round"/>
    <polygon points="500 78 757 115 742 217 826 253 767 797 500 910 233 797 174 253 258 217 243 115" fill="none" stroke="#1b1d20" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <text x="500" y="168" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="900" letter-spacing="26" text-anchor="middle">SMP</text>

  <text fill="#ffd92a" stroke="#1c1c1c" stroke-width="5" paint-order="stroke fill" font-family="Arial Black, Impact, sans-serif" font-size="86" font-weight="900" letter-spacing="2">
    <textPath href="#muhammadiyah-arc" startOffset="50%" text-anchor="middle">MUHAMMADIYAH</textPath>
  </text>

  <g stroke="#ddff32" stroke-width="12" stroke-linecap="round">
