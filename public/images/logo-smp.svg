    <path d="M408 538 Q454 538 486 568 M404 568 Q454 569 487 596 M400 596 Q449 598 486 624" fill="none" stroke-width="6" stroke-linecap="round"/>
    <path d="M592 538 Q546 538 514 568 M596 568 Q546 569 513 596 M600 596 Q551 598 514 624" fill="none" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="500" y="735" fill="#fff42b" stroke="#1c1c1c" stroke-width="7" paint-order="stroke fill" font-family="'Times New Roman', serif" font-size="80" font-weight="900" direction="rtl" unicode-bidi="bidi-override" text-anchor="middle">&#x0627;&#x0645;&#x0627;&#x0645; &#x0634;&#x0647;&#x062F;&#x0627;&#x0621;</text>

  <text fill="#fff" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="900" letter-spacing="8">
