    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(24 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(36 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(48 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(60 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(72 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(84 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(96 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(108 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(120 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(132 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(144 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(156 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(168 500 455)"/>
    <line x1="500" y1="410" x2="500" y2="315" transform="rotate(180 500 455)"/>
  </g>

  <g>
    <circle cx="500" cy="455" r="72" fill="#fff"/>
    <circle cx="500" cy="455" r="54" fill="#ffe22f" stroke="#111" stroke-width="9"/>
    <text x="500" y="480" fill="#111" font-family="'Times New Roman', serif" font-size="56" font-weight="700" direction="rtl" unicode-bidi="bidi-override" text-anchor="middle">&#x0645;&#x062D;&#x0645;&#x062F;</text>
  </g>

  <g stroke="#171717" stroke-width="8" stroke-linejoin="round">
    <path d="M388 510 Q448 507 500 555 Q552 507 612 510 L635 625 Q565 615 500 666 Q435 615 365 625 Z" fill="#fff"/>
